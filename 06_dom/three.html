<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121; color: #fff;">
</body>
<script>//this div is currently inside the memory and isn't visible on the page as it hasn't been attached to the page by the document yet 
    const div=document.createElement('div')
    console.log(div)
    div.className="main"
    // div.id="myid"
    div.id=Math.round(Math.random()*10+1)
    div.setAttribute("title","generated title")//give values in the form of key and values 
    div.style.backgroundColor='green'
    div.style.padding='12px'
    // div.innerText='tea'//all of these ways of setting an attribute overwrite the values that's y the option .setAttribute is preferred as it doesn't overwrite values and directly assigns it 
    const text=document.createTextNode("tea")
    div.appendChild(text)
    //attaching the div to the document
    document.body.appendChild(div)
</script>
</html>
